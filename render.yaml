services:
  - type: web
    name: ai-agent-backend
    runtime: python

    buildCommand: |
      pip install -r requirements.txt

    startCommand: |
      uvicorn app.main:app --host 0.0.0.0 --port 10000

    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      
      - key: OPENAI_MODEL
        sync: false
      
      - key: OPENAI_BASE_URL
        sync: false

      - key: SUPABASE_URL
        sync: false

      - key: SUPABASE_KEY
        sync: false